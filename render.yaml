services:
  - type: web
    name: idshield-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash ./build.sh"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: NODE_VERSION
        value: 20
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./idshield.db
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
